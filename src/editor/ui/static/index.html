<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor, revisão da montagem</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<!-- Tela de revisão, modo Montagem (design.md). Sem script em linha: a CSP só aceita /static/. A ordem do
     DOM é a ordem de leitura e de Tab do design: barra superior, transporte (dentro do palco), timeline,
     painel do trecho. O CSS posiciona o painel à direita do palco sem alterar essa ordem. -->

<!-- Sprite de ícones local (sem biblioteca): só os controles universais do player e o recolher do painel. -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-cut-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 6l-8 6 8 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cut-next" viewBox="0 0 24 24"><path d="M18 5v14M5 6l8 6-8 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-frame-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-frame-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM15 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
</svg>

<div id="app" class="shell" data-panel="open">

  <!-- Barra superior (44px): trabalho, hash do plano, modo, resolução e recolher do painel. -->
  <header id="topbar" class="zone zone-topbar">
    <h1 id="workdir-name" class="workdir">Editor</h1>
    <span id="plan-hash" class="hash mono" hidden></span>
    <span id="stale-badge" class="badge badge-warn" hidden>Versão desatualizada</span>
    <!-- T6: selo de aprovação entra aqui. -->
    <span id="approval-slot" class="slot" aria-hidden="true"></span>
    <div id="mode-group" class="seg" role="radiogroup" aria-label="Modo de revisão">
      <label class="seg-item"><input type="radio" name="mode" value="assembly" checked><span>Montagem</span></label>
      <!-- T5 habilita o modo Fonte; até lá o controle fica desabilitado. -->
      <label class="seg-item" title="O modo Fonte chega na próxima entrega"><input type="radio" name="mode" value="source" disabled><span>Fonte</span></label>
    </div>
    <div id="res-group" class="seg" role="radiogroup" aria-label="Resolução do player"></div>
    <span class="grow"></span>
    <!-- T6: botão "Aprovar esta versão" entra aqui. -->
    <span id="approve-slot" class="slot" aria-hidden="true"></span>
    <button id="panel-toggle" class="icon-btn" type="button" aria-controls="panel" aria-expanded="true"
            aria-label="Painel do trecho (\)" title="Painel do trecho (\)">
      <svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg>
    </button>
  </header>

  <!-- Faixa de estado (32px, só com aviso ou erro) e aviso de tela pequena (só abaixo de 720px, por CSS). -->
  <div class="zone zone-status">
    <div id="statusbar" class="statusbar" role="alert" hidden></div>
    <p class="narrow-note">Esta interface foi feita para tela de computador.</p>
  </div>

  <!-- Palco: player (vídeo e quadro de scrub sobrepostos) e barra de transporte colada embaixo. -->
  <main id="stage" class="zone zone-stage">
    <div id="player" class="player">
      <video id="video" playsinline preload="auto"></video>
      <img id="scrub" class="scrub" alt="Quadro composto na posição do cursor" hidden>
      <span id="proxy-badge" class="proxy-badge" hidden title="Esta resolução lê a cópia leve (proxy) das fontes">Proxy</span>
      <div id="spinner" class="spinner" role="status" aria-label="Carregando" hidden></div>
      <div id="player-error" class="overlay-msg" role="alert" hidden>
        <p id="player-error-text"></p>
        <button id="player-retry" class="btn" type="button">Tentar de novo</button>
      </div>
      <p id="player-empty" class="overlay-msg empty-state" hidden></p>
    </div>
    <div id="transport" class="transport" role="toolbar" aria-label="Controles de reprodução">
      <button id="btn-cut-prev" class="icon-btn" type="button" aria-label="Corte anterior (↑)" title="Corte anterior (↑)">
        <svg class="icon" aria-hidden="true"><use href="#i-cut-prev"/></svg>
      </button>
      <button id="btn-frame-prev" class="icon-btn" type="button" aria-label="Quadro anterior (←)" title="Quadro anterior (←)">
        <svg class="icon" aria-hidden="true"><use href="#i-frame-prev"/></svg>
      </button>
      <button id="btn-play" class="icon-btn" type="button" aria-label="Reproduzir (Espaço)" title="Reproduzir (Espaço)">
        <svg class="icon" aria-hidden="true"><use id="play-icon" href="#i-play"/></svg>
      </button>
      <button id="btn-frame-next" class="icon-btn" type="button" aria-label="Quadro seguinte (→)" title="Quadro seguinte (→)">
        <svg class="icon" aria-hidden="true"><use href="#i-frame-next"/></svg>
      </button>
      <button id="btn-cut-next" class="icon-btn" type="button" aria-label="Corte seguinte (↓)" title="Corte seguinte (↓)">
        <svg class="icon" aria-hidden="true"><use href="#i-cut-next"/></svg>
      </button>
      <span class="timecode mono" role="timer" aria-label="Posição na montagem">
        <span id="tc-current">00:00:00:00</span><span class="tc-sep"> / </span><span id="tc-total" class="tc-total">00:00:00:00</span>
      </span>
      <button id="btn-play-selection" class="btn" type="button" hidden title="Reproduzir só o trecho selecionado">Reproduzir seleção</button>
      <span class="grow"></span>
      <button id="btn-volume" class="icon-btn" type="button" aria-label="Silenciar (M)" title="Silenciar (M)">
        <svg class="icon" aria-hidden="true"><use id="volume-icon" href="#i-volume"/></svg>
      </button>
      <input id="volume" class="range" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
    </div>
  </main>

  <!-- Timeline em canvas: o scroller dá a barra de rolagem nativa e o canvas só desenha o que está visível. -->
  <section id="timeline" class="zone zone-timeline" aria-label="Linha do tempo">
    <div class="tl-toolbar">
      <span class="tl-title">Linha do tempo</span>
      <span class="tl-hint">Clique: mover cursor · Shift+arraste, I e O: selecionar · Alt+clique: bloco</span>
      <span class="grow"></span>
      <input id="zoom" class="range" type="range" min="0" max="100" step="1" value="0" aria-label="Zoom da linha do tempo" title="Zoom da linha do tempo (Ctrl+roda)">
      <button id="zoom-fit" class="btn btn-small" type="button" title="Ajustar a montagem inteira à largura">Ajustar</button>
    </div>
    <div id="tl-scroller" class="tl-scroller">
      <canvas id="tl-canvas" tabindex="0" role="slider" aria-label="Posição na montagem"
              aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="00:00:00:00"></canvas>
      <div id="tl-spacer" class="tl-spacer" aria-hidden="true"></div>
    </div>
    <div id="tl-tip" class="tl-tip" role="tooltip" hidden></div>
  </section>

  <!-- Painel do trecho (320px, recolhível): lista o que há na seleção e copia o contexto para a IA. -->
  <aside id="panel" class="zone zone-panel" aria-label="Trecho">
    <h2 class="panel-title">Trecho</h2>
    <div id="panel-body" class="panel-body"></div>
    <div class="panel-foot">
      <div id="manual-copy" class="manual-copy" hidden>
        <p id="manual-copy-note">Não foi possível usar a área de transferência. Copie o texto abaixo (Ctrl+C).</p>
        <textarea id="manual-text" readonly rows="7" aria-labelledby="manual-copy-note"></textarea>
      </div>
      <button id="btn-copy" class="btn btn-wide" type="button" disabled title="Copiar o trecho para colar no pedido à IA (Ctrl+Shift+C)">Copiar para IA</button>
    </div>
  </aside>
</div>

<!-- Toast: um por vez, anunciado por leitor de tela (role="status"). -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
