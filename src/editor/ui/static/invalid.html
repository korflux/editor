    color: #e6e6ea;
    font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  main { box-sizing: border-box; max-width: 420px; padding: 24px; }
  h1 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }

</style>
