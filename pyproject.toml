[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editor"
version = "0.1.0"
description = "CLI local para análise e edição linear de vídeo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
editor = "editor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
